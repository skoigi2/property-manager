name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      # Errors fail. Warnings are capped at today's count so they can only go
      # down — lower the number when you clear some (see CLAUDE.md).
      - name: Lint
        run: npm run lint -- --max-warnings 340

      - name: Unit tests
        run: npm test

  # Seeds every demo into a throwaway Postgres and checks it reads the way it
  # intends (scripts/demo-smoke.ts): arrears, invoice receipts, Kilimani's
  # meters and budget. Catches a seed or ledger-rule change that breaks the
  # sample data before anyone loads it.
  demo-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smoke
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smoke
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/smoke
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create the schema
        run: npx prisma db push --skip-generate

      - name: Demo smoke check
        run: npm run demo:smoke
